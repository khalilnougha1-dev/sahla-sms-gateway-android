name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed release APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk sahla-sms.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sahla-sms-apk
          path: sahla-sms.apk

      - name: Create release with APK
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.${{ github.run_number }}
          name: Sahla SMS v2.${{ github.run_number }}
          body: "Signed release APK — install directly on your phone."
          files: sahla-sms.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
